<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8eff4"><meta name="description" content="戳一戳，摸摸头。这里住着一只软乎乎的小团子。">
<title>戳戳团子 · 把今天揉软一点</title>
<style>
:root{color-scheme:light;--ink:#705867;--muted:#947c8a;--pink:#c27894}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}body{background:#f8eff4;background:radial-gradient(ellipse at 16% 28%,#fffaf0 0,transparent 57%),radial-gradient(ellipse at 95% 72%,#eadff4 0,transparent 60%),#f8eff4}main{position:relative;max-width:560px;min-height:650px;height:100vh;height:100svh;margin:auto;overflow:hidden;display:flex;flex-direction:column;padding:calc(25px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;z-index:2}.brand{font-size:14px;letter-spacing:2px;font-weight:600;display:flex;align-items:center;gap:9px}.brand span{color:#bf7797;font-size:22px}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,canvas:focus-visible{outline:3px solid #c37caa;outline-offset:5px}.sound{width:44px;height:44px;border:1px solid #ffffffd9;border-radius:50%;background:#ffffff70;display:grid;place-items:center;box-shadow:0 4px 14px #99778c08}.sound svg{width:20px;height:20px}.intro{text-align:center;margin-top:clamp(28px,5vh,55px);z-index:1;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:4px;color:#9f8193}.intro h1{font-size:32px;font-weight:600;letter-spacing:5px;margin:12px 0}.intro p{font-size:14px;letter-spacing:2px;margin:0;color:#947c8a}.play{position:relative;flex:1;min-height:330px;margin:0 -26px}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none}.bubble{position:absolute;left:50%;top:8%;transform:translateX(-50%);white-space:nowrap;padding:11px 19px;background:#fffc;border:1px solid white;border-radius:20px;color:#a16f86;font-size:14px;box-shadow:0 7px 25px #99778c09;pointer-events:none;transition:opacity .3s}.bubble:after{content:"";position:absolute;bottom:-5px;left:47%;width:10px;height:10px;background:#fff9;transform:rotate(45deg)}footer{z-index:1;text-align:center}.guide{display:flex;justify-content:center;gap:24px;font-size:14px}.guide span{display:flex;align-items:center;gap:7px}.guide i{font-style:normal;color:#b87f9c;font-size:19px}.note{font-size:12px;letter-spacing:2px;color:#a58b9a;margin:23px 0 0}.divider{width:30px;height:3px;background:#dec8d7;border-radius:2px;margin:0 auto 22px}.sound-hint{position:absolute;right:28px;top:calc(76px + env(safe-area-inset-top));font-size:12px;z-index:3;color:#94687d}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:700px){main{max-height:940px}.intro h1{font-size:36px}}@media(max-height:700px){main{min-height:540px;padding-top:14px;padding-bottom:16px}.intro{margin-top:14px}.intro h1{font-size:28px;margin:9px 0}.play{min-height:270px}.note{margin-top:15px}.divider{margin-bottom:16px}}@media(prefers-reduced-motion:reduce){.bubble{transition:none}}
</style>
</head>
<body><main><header><div class="brand"><span>✿</span> 一小团快乐</div><button class="sound" id="sound" aria-label="开启声音" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="soundmark" d="m16 9 6 6m0-6-6 6"/></svg></button></header><div class="sound-hint" id="soundhint" hidden>声音已开启</div><section class="intro"><div class="eyebrow">SOFT LITTLE MOMENTS</div><h1>戳戳团子</h1><p>把今天，揉软一点。</p></section><section class="play" id="play"><canvas id="world" tabindex="0" role="button" aria-label="软乎乎的小团子。轻点戳戳，上半部滑动摸头，长按害羞。键盘空格或回车也能戳。"></canvas><div class="bubble" id="bubble" aria-live="polite">来，戳我一下呀 ♡</div></section><footer><div class="divider"></div><div class="guide"><span><i>☝</i> 轻轻戳</span><span><i>〰</i> 摸摸头</span><span><i>♡</i> 长按贴贴</span></div><p class="note">不用做什么，陪它一小会儿就好</p></footer></main><noscript>请在浏览器中启用 JavaScript，让团子动起来。</noscript>
<script>
'use strict';
// No network, dependencies or external assets. Canvas soft-body contour uses
// 80 coupled damped springs; an independent pressure field renders the dent.
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),play=document.getElementById('play'),bubble=document.getElementById('bubble');
const TAU=Math.PI*2,N=80,nodes=Array.from({length:N},()=>({d:0,v:0}));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,r=0,cx=0,cy=0,time=0,prev=0,frame=0,active=null,pressure=0,pv=0,shy=0,expression='normal',exprUntil=0,nextBlink=2,blinkUntil=0,nextIdle=9,gaze=0,gazeTarget=0,combo=0,lastTap=-10,particles=[],dent={x:0,y:0},tilt=0,tiltV=0,sound=false,audio=null,bubbleUntil=4;
function resize(){const b=play.getBoundingClientRect();w=b.width;h=b.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);r=Math.min(w*.315,h*.32,166);cx=w/2;cy=h*.55;}
if(window.ResizeObserver)new ResizeObserver(resize).observe(play);else window.addEventListener('resize',resize);resize();
function say(s,d=2.3){if(bubble.textContent!==s)bubble.textContent=s;bubble.style.opacity='1';bubbleUntil=time+d;}
function face(s,d=1.3){expression=s;exprUntil=time+d;}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,TAU);ctx.fillStyle=fill;ctx.fill();}
function heart(x,y,size,color,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(size,size);ctx.beginPath();ctx.moveTo(0,.7);ctx.bezierCurveTo(-1,-.02,-.65,-.85,0,-.35);ctx.bezierCurveTo(.65,-.85,1,-.02,0,.7);ctx.fillStyle=color;ctx.fill();ctx.restore();}
function star(x,y,s,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();for(let i=0;i<8;i++){const q=i%2?s*.3:s;ctx.lineTo(Math.cos(i*Math.PI/4)*q,Math.sin(i*Math.PI/4)*q)}ctx.closePath();ctx.fillStyle='#d9b678';ctx.fill();ctx.restore();}
function burst(x,y,n=3){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*85,vy:-45-Math.random()*70,life:0,max:1.4+Math.random()*.6,s:7+Math.random()*7,heart:Math.random()>.22,rot:(Math.random()-.5)*.6});particles=particles.slice(-65);}
function tone(special=false){if(!sound)return;try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC()}audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.setValueAtTime(special?720:490+Math.random()*100,t);o.frequency.exponentialRampToValueAtTime(special?1050:330,t+.13);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.065,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.24)}catch{sound=false;updateSound();}}
function updateSound(){document.getElementById('sound').setAttribute('aria-pressed',String(sound));document.getElementById('sound').setAttribute('aria-label',sound?'关闭声音':'开启声音');document.getElementById('soundmark').setAttribute('d',sound?'M16 8q4 4 0 8m3-11q7 7 0 14':'m16 9 6 6m0-6-6 6');}
document.getElementById('sound').onclick=()=>{sound=!sound;updateSound();if(sound)tone();const el=document.getElementById('soundhint');el.hidden=false;el.textContent=sound?'声音已开启':'安安静静陪你';setTimeout(()=>el.hidden=true,1600)};
function local(clientX,clientY){const b=canvas.getBoundingClientRect();return{x:(clientX-b.left-cx)/r,y:(clientY-b.top-cy)/r};}
function hit(p){return p.x*p.x+(p.y/.87)**2<1.04;}
function begin(p,id){if(active||!hit(p))return false;active={id,x:p.x,y:p.y,start:time,lastX:p.x,lastY:p.y,travel:0,pet:false,held:false};dent={x:p.x,y:p.y};pv+=5;tiltV+=p.x*.28;face(p.y>.12?['surprise','happy','shy'][Math.floor(Math.random()*3)]:'happy',.8);tone();return true;}
function move(p){if(!active)return;active.travel+=Math.hypot(p.x-active.lastX,p.y-active.lastY);if(p.y<-.13&&active.y<.05&&active.travel>.16){active.pet=true;face('content',1.4);say('嗯～最喜欢摸摸头了',1.5);tiltV+=(p.x-active.lastX)*2;if(Math.random()<.17)burst(cx+p.x*r,cy+p.y*r,1);}active.lastX=p.x;active.lastY=p.y;dent.x=Math.max(-.9,Math.min(.9,p.x));dent.y=Math.max(-.8,Math.min(.8,p.y));}
function end(cancel=false){if(!active)return;const a=active;active=null;if(cancel){combo=0;return;}if(a.pet){face('content',1.8);say('再摸一下嘛 ♡');burst(cx,cy-r*.7,3);}else if(a.held){face('shy',1.6);say('被你捧在手心啦');burst(cx,cy-r*.7,5);}else if(a.travel<.24){combo=time-lastTap<.65?combo+1:1;lastTap=time;tiltV+=a.x*(.3+combo*.08);if(combo>=6){face('love',2.5);say('给你一整团喜欢！',2.8);burst(cx,cy-r*.3,18);tone(true);combo=0;nodes.forEach((n,i)=>n.v+=Math.cos(i/N*TAU*3)*1.3);}else{face(['happy','surprise','shy'][Math.floor(Math.random()*3)],1.1);say(a.y>.15?['唔！肚肚软软的','嘿嘿，有一点点痒','啵叽～'][Math.floor(Math.random()*3)]:['是你呀 ♡','软乎乎，任你戳','收到你的小温柔啦'][Math.floor(Math.random()*3)]);if(combo>1||Math.random()<.5)burst(cx+a.x*r,cy+a.y*r,Math.min(combo+1,6));}}}
if(window.PointerEvent){canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(begin(local(e.clientX,e.clientY),e.pointerId)){e.preventDefault();canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(active&&active.id===e.pointerId)move(local(e.clientX,e.clientY))});canvas.addEventListener('pointerup',e=>{if(active&&active.id===e.pointerId)end()});canvas.addEventListener('pointercancel',()=>end(true));canvas.addEventListener('lostpointercapture',()=>end(true));}else{canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];if(begin(local(t.clientX,t.clientY),t.identifier))e.preventDefault()},{passive:false});canvas.addEventListener('touchmove',e=>{if(!active)return;const t=Array.from(e.touches).find(t=>t.identifier===active.id);if(t){e.preventDefault();move(local(t.clientX,t.clientY))}},{passive:false});canvas.addEventListener('touchend',e=>{if(active&&Array.from(e.changedTouches).some(t=>t.identifier===active.id))end()});canvas.addEventListener('touchcancel',()=>end(true));canvas.addEventListener('mousedown',e=>begin(local(e.clientX,e.clientY),'mouse'));window.addEventListener('mousemove',e=>{if(active&&active.id==='mouse')move(local(e.clientX,e.clientY))});window.addEventListener('mouseup',()=>end());}
canvas.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();begin({x:0,y:.3},'key')}});canvas.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(active?.id==='key')end()}});canvas.addEventListener('blur',()=>end(true));canvas.addEventListener('contextmenu',e=>e.preventDefault());
function outline(){const pts=[];for(let i=0;i<N;i++){const a=i/N*TAU;const d=nodes[i].d;pts.push({x:Math.cos(a)*(1+d)*(1+.035*Math.sin(a)),y:Math.sin(a)*(.88+d)});}ctx.beginPath();ctx.moveTo((pts[N-1].x+pts[0].x)/2,(pts[N-1].y+pts[0].y)/2);for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];ctx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2)}ctx.closePath();}
function drawFace(){const px=dent.x*pressure*.035,py=dent.y*pressure*.04;ctx.save();ctx.translate(px,py+.075);const mood=active?.pet?'content':active?.held?'shy':expression;const closed=time<blinkUntil||mood==='content'||mood==='happy';const ey=.005;for(const side of [-1,1]){const x=side*.29+gaze*.025;let g=ctx.createRadialGradient(side*.47,.17,.015,side*.47,.17,.19);g.addColorStop(0,`rgba(236,130,159,${.4+shy*.32})`);g.addColorStop(1,'rgba(244,165,184,0)');ellipse(side*.47,.17,.23,.135,g);ctx.strokeStyle='#674b50';ctx.lineWidth=.027;ctx.lineCap='round';if(mood==='love'){heart(x,ey,.095,'#b97190');}else if(closed){ctx.beginPath();ctx.moveTo(x-.067,ey+.017);ctx.quadraticCurveTo(x,ey-.059,x+.067,ey+.017);ctx.stroke();}else{ellipse(x,ey,mood==='shy'?.034:.039,mood==='surprise'?.066:.052,'#554146');ellipse(x-.012,ey-.02,.012,.015,'#fff8ec');}if(mood==='shy'||shy>.4){ctx.strokeStyle='#d88ba3';ctx.lineWidth=.01;for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(side*.46-.035+j*.03,.145);ctx.lineTo(side*.46-.045+j*.03,.185);ctx.stroke();}}}ctx.strokeStyle='#785159';ctx.lineWidth=.021;ctx.lineCap='round';ctx.beginPath();if(mood==='surprise'||mood==='yawn'){ellipse(0,.14,.041,mood==='yawn'?.08:.052,'#976b75');ellipse(0,.17,.022,.014,'#e8a6b6');}else if(mood==='love'||mood==='happy'){ctx.moveTo(-.066,.115);ctx.quadraticCurveTo(0,.24,.066,.115);ctx.closePath();ctx.fillStyle='#9d6c77';ctx.fill();ellipse(0,.157,.031,.016,'#e9aab5');}else{ctx.moveTo(-.055,.128);ctx.quadraticCurveTo(0,.185,.055,.128);ctx.stroke();}ctx.restore();}
function step(dt){time+=dt;const held=active&&!active.pet&&time-active.start>.6&&active.travel<.24;if(held&&!active.held){active.held=true;face('shy',4);say('贴贴…有一点害羞 ♡',4)}const target=active?1:0;pv+=(target-pressure)*125*dt-pv*14*dt;pressure+=pv*dt;shy+=(Number(!!(active?.held||active?.pet||expression==='shy'))-shy)*dt*4;tiltV+=(-tilt*65-tiltV*8)*dt;tilt+=tiltV*dt;gaze+=(gazeTarget-gaze)*dt*2;for(let k=0;k<2;k++){const ds=dt/2;const next=nodes.map((n,i)=>{const a=i/N*TAU,x=Math.cos(a),y=Math.sin(a)*.88,dist=(x-dent.x)**2+(y-dent.y)**2;const local=-.19*Math.exp(-dist/.13)*pressure;const bulge=.021*pressure;return (local+bulge-n.d)*160+(nodes[(i+1)%N].d+nodes[(i+N-1)%N].d-2*n.d)*65-n.v*10;});nodes.forEach((n,i)=>{n.v+=next[i]*ds;n.d+=n.v*ds})}if(time>exprUntil)expression='normal';if(time>nextBlink){blinkUntil=time+.14;nextBlink=time+2.5+Math.random()*4}if(time>nextIdle&&!active){nextIdle=time+8+Math.random()*8;gazeTarget=Math.random()*2-1;if(Math.random()<.4)face('yawn',1.3);else if(Math.random()<.45)face('happy',1.1)}if(time>bubbleUntil)bubble.style.opacity='0';for(const p of particles){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=19*dt}particles=particles.filter(p=>p.life<p.max);}
function render(){ctx.clearRect(0,0,w,h); // Calm, sparse floating accents.
for(let i=0;i<9;i++){const x=w*(.08+((i*.271)% .86)),y=h*(.13+((i*.197)%.7))+(reduced?0:Math.sin(time*.38+i)*7);ctx.globalAlpha=.28;if(i%3===0){ctx.strokeStyle='#d1b6cd';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,9+i%4*3,0,TAU);ctx.stroke();ellipse(x-3,y-4,2,2,'#fff');}else if(i%3===1)star(x,y,4+i%3,time*.05);else heart(x,y,6,'#d9a7bc',-.2);}ctx.globalAlpha=1;
const breath=reduced?0:Math.sin(time*1.65)*.009,fy=reduced?0:Math.sin(time*1.15)*2;const base=cy+r*.91;let g=ctx.createRadialGradient(cx,base+15,2,cx,base+15,r*1.2);g.addColorStop(0,'#d3b6d54d');g.addColorStop(1,'#d3b6d500');ellipse(cx,base+15,r*1.3,r*.29,g);let pad=ctx.createLinearGradient(0,base-15,0,base+25);pad.addColorStop(0,'#f2e4f4');pad.addColorStop(1,'#ddcce6');ellipse(cx,base+7,r*1.17,r*.24,pad);ellipse(cx,base,r*1.17,r*.2,'#f5ebf7');ctx.strokeStyle='#fffc';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(cx,base,r*1.08,r*.155,0,0,TAU);ctx.stroke();g=ctx.createRadialGradient(cx,base-5,1,cx,base-5,r*.8);g.addColorStop(0,'#b68caf55');g.addColorStop(1,'#b68caf00');ellipse(cx,base-5,r*.82,r*.14,g);
ctx.save();ctx.translate(cx,cy+fy+shy*r*.025);ctx.rotate(tilt+(active?.pet?Math.sin(time*8)*.027:0));ctx.scale(r*(1+breath-shy*.025),r*(1-breath-shy*.03));outline();ctx.shadowColor='#c69bb038';ctx.shadowBlur=17;ctx.shadowOffsetY=10;ctx.fillStyle='#fff4ea';ctx.fill();ctx.shadowColor='transparent';ctx.clip();g=ctx.createRadialGradient(-.34,-.48,.09,.02,-.08,1.11);g.addColorStop(0,'#fffefa');g.addColorStop(.47,'#fff9ef');g.addColorStop(.77,'#fbe8e3');g.addColorStop(.93,'#eac9d4');g.addColorStop(1,'#d4b0c7');ctx.fillStyle=g;ctx.fillRect(-1.4,-1.3,2.8,2.6);
g=ctx.createRadialGradient(-.43,-.5,0,-.43,-.5,.51);g.addColorStop(0,'#ffffffed');g.addColorStop(.55,'#ffffff44');g.addColorStop(1,'#ffffff00');ellipse(-.43,-.5,.5,.36,g);ctx.save();ctx.rotate(-.36);ellipse(-.18,-.64,.17,.048,'#ffffffa8');ellipse(.06,-.69,.035,.023,'#ffffff8c');ctx.restore();
// A spatial pressure bowl: shaded center + soft lower rim at the exact touch.
if(Math.abs(pressure)>.015){const depth=Math.min(1.2,Math.abs(pressure));g=ctx.createRadialGradient(dent.x,dent.y-.025,.012,dent.x,dent.y,.23);g.addColorStop(0,`rgba(187,128,156,${depth*.17})`);g.addColorStop(.65,`rgba(219,164,186,${depth*.08})`);g.addColorStop(1,'rgba(219,164,186,0)');ellipse(dent.x,dent.y,.25,.22,g);ctx.strokeStyle=`rgba(255,255,255,${depth*.62})`;ctx.lineWidth=.014;ctx.beginPath();ctx.ellipse(dent.x,dent.y+.015,.13,.09,0,.16,2.85);ctx.stroke();}drawFace();ctx.restore();
for(const p of particles){ctx.globalAlpha=Math.max(0,Math.sin(Math.PI*p.life/p.max));if(p.heart)heart(p.x,p.y,p.s,'#d997b5',p.rot);else star(p.x,p.y,p.s*.7,p.rot+p.life)}ctx.globalAlpha=1;}
function tick(t){const dt=Math.min((t-prev)/1000||.016,.033);prev=t;step(dt);render();frame=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);end(true);if(!document.hidden){prev=performance.now();frame=requestAnimationFrame(tick)}});window.addEventListener('pagehide',()=>{end(true);if(audio)audio.suspend().catch(()=>{})});frame=requestAnimationFrame(tick);
</script></body></html>
