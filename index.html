<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>照片碎片 · 手机版</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    color: #fff;
    background: #11131d;
  }

  body.theme-stars {
    background:
      radial-gradient(circle at 20% 15%, rgba(132,122,255,.22), transparent 28%),
      radial-gradient(circle at 80% 28%, rgba(255,153,204,.17), transparent 30%),
      linear-gradient(145deg, #10111b, #1c1a31 50%, #0a0d16);
  }

  body.theme-sakura {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,220,232,.42), transparent 28%),
      radial-gradient(circle at 78% 32%, rgba(255,183,205,.26), transparent 30%),
      linear-gradient(145deg, #2e1f2c, #4a2f42 50%, #211522);
  }

  #ambient {
    position: fixed;
    inset: -30%;
    pointer-events: none;
    background:
      radial-gradient(circle, rgba(255,255,255,.06), transparent 22%),
      radial-gradient(circle at 70% 60%, rgba(170,190,255,.09), transparent 22%);
    animation: floatBg 13s ease-in-out infinite alternate;
  }

  @keyframes floatBg {
    from { transform: translate(-3%,-2%) scale(1); }
    to { transform: translate(4%,3%) scale(1.07); }
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .top {
    position: fixed;
    z-index: 20;
    top: calc(env(safe-area-inset-top) + 10px);
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  .brand {
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .14em;
    background: rgba(10,10,18,.30);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(16px);
  }

  .mini-actions {
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }

  .mini-btn {
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.09);
    color: white;
    border-radius: 14px;
    font-size: 18px;
    backdrop-filter: blur(16px);
  }

  .bottom-sheet {
    position: fixed;
    z-index: 30;
    left: 10px;
    right: 10px;
    bottom: calc(env(safe-area-inset-bottom) + 10px);
    padding: 12px;
    border-radius: 22px;
    background: rgba(10,10,18,.38);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
  }

  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .row + .row { margin-top: 8px; }

  button, label, input[type="text"] {
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.09);
    color: #fff;
    border-radius: 14px;
    min-height: 44px;
    font-size: 13px;
    outline: none;
  }

  button, label {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  label input[type="file"] { display: none; }

  #messageInput {
    grid-column: span 4;
    width: 100%;
    padding: 0 12px;
  }

  #messageInput::placeholder {
    color: rgba(255,255,255,.45);
  }

  .status {
    grid-column: span 4;
    text-align: center;
    color: rgba(255,255,255,.55);
    font-size: 11px;
    min-height: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #reveal {
    position: fixed;
    z-index: 15;
    left: 50%;
    bottom: 31%;
    transform: translate(-50%, 18px);
    opacity: 0;
    width: min(88vw, 620px);
    text-align: center;
    pointer-events: none;
    transition: opacity 1.1s ease, transform 1.1s ease;
  }

  #reveal.show {
    opacity: 1;
    transform: translate(-50%,0);
  }

  #reveal .line {
    font-size: clamp(19px, 5.7vw, 31px);
    font-weight: 700;
    letter-spacing: .05em;
    text-shadow: 0 0 26px rgba(255,255,255,.25);
  }

  #reveal .sub {
    margin-top: 9px;
    color: rgba(255,255,255,.6);
    font-size: 11px;
    letter-spacing: .13em;
  }

  #hint {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: 16%;
    transform: translateX(-50%);
    width: 80%;
    text-align: center;
    color: rgba(255,255,255,.56);
    font-size: 12px;
    pointer-events: none;
  }

  @media (orientation: landscape) and (max-height: 520px) {
    .bottom-sheet {
      width: min(760px, calc(100% - 20px));
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      padding: 9px;
    }
    #reveal { bottom: 28%; }
  }
</style>
</head>

<body class="theme-stars">
<div id="ambient"></div>

<div class="top">
  <div class="brand">PHOTO FRAGMENTS</div>
  <div class="mini-actions">
    <button class="mini-btn" id="themeBtn" aria-label="切换主题">✦</button>
    <button class="mini-btn" id="fullBtn" aria-label="全屏">⛶</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<div id="hint">上传照片后，用手指滑动扰动碎片 · 点一下屏幕会爆开星光</div>

<div id="reveal">
  <div class="line" id="revealText">愿你每天都有一点小惊喜。</div>
  <div class="sub">PHOTO MEMORY · JUST FOR YOU</div>
</div>

<div class="bottom-sheet">
  <div class="row">
    <label>照片<input id="fileInput" type="file" accept="image/*"></label>
    <label>音乐<input id="musicInput" type="file" accept="audio/*"></label>
    <button id="musicBtn">播放</button>
    <button id="assembleBtn">拼回</button>
  </div>

  <div class="row">
    <button id="scatterBtn">散开</button>
    <button id="petalBtn">花瓣</button>
    <button id="centerBtn">居中</button>
    <button id="hideBtn">隐藏栏</button>
  </div>

  <div class="row">
    <input id="messageInput" type="text" maxlength="40" placeholder="输入拼好后出现的一句话">
    <div class="status" id="musicStatus">未选择音乐</div>
  </div>
</div>

<audio id="audio" loop></audio>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const fileInput = document.getElementById('fileInput');
const musicInput = document.getElementById('musicInput');
const musicBtn = document.getElementById('musicBtn');
const musicStatus = document.getElementById('musicStatus');
const assembleBtn = document.getElementById('assembleBtn');
const scatterBtn = document.getElementById('scatterBtn');
const petalBtn = document.getElementById('petalBtn');
const centerBtn = document.getElementById('centerBtn');
const themeBtn = document.getElementById('themeBtn');
const fullBtn = document.getElementById('fullBtn');
const hideBtn = document.getElementById('hideBtn');
const bottomSheet = document.querySelector('.bottom-sheet');

const messageInput = document.getElementById('messageInput');
const reveal = document.getElementById('reveal');
const revealText = document.getElementById('revealText');
const hint = document.getElementById('hint');
const audio = document.getElementById('audio');

let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
let img = null;
let pieces = [];
let particles = [];
let petals = [];
let burstPetals = [];
let mode = 'float';
let theme = 'stars';
let pointer = {x:-9999,y:-9999,down:false,lastX:0,lastY:0};
let last = performance.now();
let assembleTimer = null;
let musicURL = null;
let sheetHidden = false;

function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (img) buildPieces(false);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300));

function fitRect(){
  const portrait = H >= W;
  const maxW = W * (portrait ? .84 : .64);
  const maxH = H * (portrait ? .50 : .58);
  const s = Math.min(maxW / img.width, maxH / img.height, 1.4);
  const w = img.width * s;
  const h = img.height * s;
  const yShift = portrait ? -H*.04 : 8;
  return {x:W/2-w/2, y:H/2-h/2+yShift, w, h};
}

function buildPieces(randomize=true){
  if(!img) return;
  const rect = fitRect();
  const cols = Math.max(7, Math.min(12, Math.round(rect.w/58)));
  const rows = Math.max(6, Math.min(12, Math.round(rect.h/58)));
  const sw = img.width/cols, sh = img.height/rows;
  const dw = rect.w/cols, dh = rect.h/rows;
  const old = pieces;

  pieces = [];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const tx = rect.x + c*dw + dw/2;
      const ty = rect.y + r*dh + dh/2;
      const i = r*cols+c;
      const a = Math.random()*Math.PI*2;
      const dist = 70 + Math.random()*Math.min(W,H)*.38;
      const prev = old[i];

      pieces.push({
        sx:c*sw, sy:r*sh, sw, sh,
        w:dw+1, h:dh+1,
        x: randomize || !prev ? tx+Math.cos(a)*dist : prev.x,
        y: randomize || !prev ? ty+Math.sin(a)*dist : prev.y,
        tx, ty,
        vx:(Math.random()-.5)*1.0,
        vy:(Math.random()-.5)*1.0,
        rot:(Math.random()-.5)*.75,
        spin:(Math.random()-.5)*.008,
        seed:Math.random()*999
      });
    }
  }

  reveal.classList.remove('show');
  mode = 'float';
}

function rounded(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function burst(x,y,count=24){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=1.2+Math.random()*4.5;
    particles.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,size:1+Math.random()*2.8
    });
  }
}

function petalExplosion(x,y,count=110){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=2+Math.random()*6;
    burstPetals.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp-Math.random()*1.7,
      g:.04+Math.random()*.035,
      rot:Math.random()*Math.PI,
      vr:(Math.random()-.5)*.2,
      size:4+Math.random()*7,
      life:1
    });
  }
}

function scatter(){
  if(!img) return;
  clearTimeout(assembleTimer);
  reveal.classList.remove('show');
  mode='float';

  for(const p of pieces){
    const a=Math.atan2(p.y-H/2,p.x-W/2)+(Math.random()-.5)*.8;
    const power=2.7+Math.random()*4.5;
    p.vx+=Math.cos(a)*power;
    p.vy+=Math.sin(a)*power;
    p.spin+=(Math.random()-.5)*.035;
  }
  burst(W/2,H/2,42);
}

function assemble(){
  if(!img) return;
  clearTimeout(assembleTimer);
  reveal.classList.remove('show');
  mode='assemble';

  assembleTimer=setTimeout(()=>{
    revealText.textContent = messageInput.value.trim() || '愿你每天都有一点小惊喜。';
    reveal.classList.add('show');
    burst(W/2,H/2,60);
    petalExplosion(W/2,H/2,130);
  }, 2100);
}

function centerPieces(){
  if(!img) return;
  for(const p of pieces){
    p.vx += (p.tx-p.x)*.035;
    p.vy += (p.ty-p.y)*.035;
  }
}

function createPetal(){
  petals.push({
    x:Math.random()*W,
    y:-20,
    vx:(Math.random()-.5)*.45,
    vy:.45+Math.random()*.8,
    rot:Math.random()*Math.PI,
    vr:(Math.random()-.5)*.025,
    s:4+Math.random()*5
  });
}

function affectPieces(x,y,dx=0,dy=0,strong=false){
  for(const p of pieces){
    const px=p.x-x, py=p.y-y;
    const d=Math.hypot(px,py);
    const radius = strong ? 250 : 145;
    if(d<radius){
      const f=(radius-d)/radius;
      const inv=1/(d||1);

      if(strong){
        p.vx += px*inv*f*4.6;
        p.vy += py*inv*f*4.6;
      }else{
        p.vx += dx*.08*f + px*inv*f*.25;
        p.vy += dy*.08*f + py*inv*f*.25;
      }
      p.spin += (Math.random()-.5)*(strong ? .03 : .009);
    }
  }
}

function update(dt,t){
  if(theme==='sakura' && Math.random()<0.06) createPetal();

  for(const p of pieces){
    if(mode==='assemble'){
      p.vx+=(p.tx-p.x)*.016;
      p.vy+=(p.ty-p.y)*.016;
      p.rot+=(0-p.rot)*.08;
      p.vx*=.87;
      p.vy*=.87;
      p.spin*=.86;
    }else{
      p.vx += Math.sin(t*.0007+p.seed)*.007;
      p.vy += Math.cos(t*.0009+p.seed)*.007;
      p.vx*=.992;
      p.vy*=.992;
      p.rot += p.spin*dt;
    }

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    const m=100;
    if(p.x<-m)p.x=W+m;
    if(p.x>W+m)p.x=-m;
    if(p.y<-m)p.y=H+m;
    if(p.y>H+m)p.y=-m;
  }

  particles.forEach(q=>{
    q.x+=q.vx*dt;
    q.y+=q.vy*dt;
    q.vx*=.985;
    q.vy*=.985;
    q.life-=.018*dt;
  });
  particles=particles.filter(q=>q.life>0);

  petals.forEach(p=>{
    p.x+=p.vx*dt + Math.sin((t*.001)+p.y*.02)*.15;
    p.y+=p.vy*dt;
    p.rot+=p.vr*dt;
  });
  petals=petals.filter(p=>p.y<H+30);

  burstPetals.forEach(p=>{
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=p.g*dt;
    p.vx*=.992;
    p.rot+=p.vr*dt;
    p.life-=.010*dt;
  });
  burstPetals=burstPetals.filter(p=>p.life>0 && p.y<H+80);
}

function drawBg(t){
  if(theme==='stars'){
    ctx.save();
    for(let i=0;i<48;i++){
      const x=(i*137.3+Math.sin(t*.00018+i)*70)%W;
      const y=(i*83.7+Math.cos(t*.00021+i)*55)%H;
      const r=.7+(i%4)*.42;
      ctx.globalAlpha=.17+((i%5)*.035);
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  if(theme==='sakura'){
    ctx.save();
    for(const p of petals){
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle='rgba(255,210,226,.72)';
      ctx.beginPath();
      ctx.ellipse(0,0,p.s,p.s*.55,0,0,Math.PI*2);
      ctx.fill();
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }
    ctx.restore();
  }
}

function drawPieces(){
  const sorted=[...pieces].sort((a,b)=>a.y-b.y);
  for(const p of sorted){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.shadowColor='rgba(0,0,0,.34)';
    ctx.shadowBlur=mode==='assemble'?7:15;
    ctx.shadowOffsetY=5;

    rounded(-p.w/2,-p.h/2,p.w,p.h,6);
    ctx.clip();
    ctx.drawImage(img,p.sx,p.sy,p.sw,p.sh,-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    rounded(-p.w/2,-p.h/2,p.w,p.h,6);
    ctx.strokeStyle='rgba(255,255,255,.22)';
    ctx.lineWidth=.6;
    ctx.stroke();
    ctx.restore();
  }
}

function drawParticles(){
  ctx.save();
  for(const q of particles){
    ctx.globalAlpha=q.life;
    ctx.fillStyle=theme==='sakura'?'rgba(255,220,236,1)':'rgba(220,232,255,1)';
    ctx.shadowBlur=14;
    ctx.shadowColor=ctx.fillStyle;
    ctx.beginPath();
    ctx.arc(q.x,q.y,q.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBurstPetals(){
  ctx.save();
  for(const p of burstPetals){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle='rgba(255,190,218,.95)';
    ctx.beginPath();
    ctx.ellipse(0,0,p.size,p.size*.55,0,0,Math.PI*2);
    ctx.fill();
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  ctx.restore();
}

function drawEmpty(){
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.font='600 24px PingFang SC';
  ctx.fillText('放进一张你喜欢的照片',W/2,H/2-14);
  ctx.fillStyle='rgba(255,255,255,.48)';
  ctx.font='12px PingFang SC';
  ctx.fillText('它会变成漂浮在夜色里的记忆碎片',W/2,H/2+20);
  ctx.restore();
}

function loop(now){
  const dt=Math.min((now-last)/16.67,2.1);
  last=now;

  ctx.clearRect(0,0,W,H);
  drawBg(now);
  update(dt,now);
  if(img) drawPieces(); else drawEmpty();
  drawParticles();
  drawBurstPetals();

  requestAnimationFrame(loop);
}

fileInput.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=ev=>{
    const im=new Image();
    im.onload=()=>{
      img=im;
      buildPieces(true);
      hint.textContent='手指滑动会推开碎片 · 点一下会爆开 · 拼好后有花瓣';
      setTimeout(assemble,1100);
    };
    im.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

musicInput.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  if(musicURL) URL.revokeObjectURL(musicURL);
  musicURL=URL.createObjectURL(file);
  audio.src=musicURL;
  musicStatus.textContent=file.name;
  musicBtn.textContent='播放';
});

musicBtn.addEventListener('click',async()=>{
  if(!audio.src){
    musicStatus.textContent='请先选择音乐';
    return;
  }

  if(audio.paused){
    try{
      await audio.play();
      musicBtn.textContent='暂停';
    }catch(e){
      musicStatus.textContent='请再点一次播放';
    }
  }else{
    audio.pause();
    musicBtn.textContent='播放';
  }
});

audio.addEventListener('play',()=>musicBtn.textContent='暂停');
audio.addEventListener('pause',()=>musicBtn.textContent='播放');

assembleBtn.onclick=assemble;
scatterBtn.onclick=scatter;
petalBtn.onclick=()=>petalExplosion(W/2,H*.42,150);
centerBtn.onclick=centerPieces;

themeBtn.onclick=()=>{
  theme=theme==='stars'?'sakura':'stars';
  document.body.className=theme==='stars'?'theme-stars':'theme-sakura';
  burst(W/2,H/2,28);
};

fullBtn.onclick=async()=>{
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
};

hideBtn.onclick=()=>{
  sheetHidden=!sheetHidden;
  bottomSheet.style.transform=sheetHidden?'translateY(calc(100% + 20px))':'translateY(0)';
  bottomSheet.style.transition='transform .35s ease';
  hideBtn.textContent=sheetHidden?'显示栏':'隐藏栏';

  if(sheetHidden){
    setTimeout(()=>{
      const showBtn=document.createElement('button');
      showBtn.id='floatingShowBtn';
      showBtn.textContent='菜单';
      Object.assign(showBtn.style,{
        position:'fixed',
        zIndex:'40',
        right:'14px',
        bottom:'calc(env(safe-area-inset-bottom) + 14px)',
        width:'58px',
        height:'44px',
        borderRadius:'14px',
        border:'1px solid rgba(255,255,255,.14)',
        background:'rgba(10,10,18,.42)',
        color:'#fff',
        backdropFilter:'blur(16px)'
      });
      showBtn.onclick=()=>{
        sheetHidden=false;
        bottomSheet.style.transform='translateY(0)';
        hideBtn.textContent='隐藏栏';
        showBtn.remove();
      };
      document.body.appendChild(showBtn);
    },350);
  }else{
    document.getElementById('floatingShowBtn')?.remove();
  }
};

function pointerDown(x,y){
  pointer.down=true;
  pointer.x=x; pointer.y=y;
  pointer.lastX=x; pointer.lastY=y;
}

function pointerMove(x,y){
  if(!pointer.down)return;
  const dx=x-pointer.lastX;
  const dy=y-pointer.lastY;
  pointer.x=x; pointer.y=y;
  affectPieces(x,y,dx,dy,false);
  pointer.lastX=x; pointer.lastY=y;
  reveal.classList.remove('show');
  mode='float';
}

function pointerUp(x,y,moved){
  pointer.down=false;
  if(!moved && img){
    affectPieces(x,y,0,0,true);
    burst(x,y,32);
    reveal.classList.remove('show');
    mode='float';
  }
}

let moved=false;

canvas.addEventListener('pointerdown',e=>{
  moved=false;
  canvas.setPointerCapture?.(e.pointerId);
  pointerDown(e.clientX,e.clientY);
});

canvas.addEventListener('pointermove',e=>{
  if(pointer.down){
    if(Math.hypot(e.clientX-pointer.lastX,e.clientY-pointer.lastY)>2)moved=true;
    pointerMove(e.clientX,e.clientY);
  }
});

canvas.addEventListener('pointerup',e=>{
  pointerUp(e.clientX,e.clientY,moved);
});

canvas.addEventListener('pointercancel',()=>{
  pointer.down=false;
});

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
